<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>金錢卦起卦</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <a href="index.html" class="page-switch page-switch-tarot" title="塔羅占卜" aria-label="切換到塔羅占卜">
    <img src="assets/images/塔羅牌/卡背/經典.jpg" alt="" class="page-switch-icon" />
    <span class="page-switch-label">塔羅占卜</span>
  </a>

  <button type="button" id="coin-style-toggle" class="coin-style-toggle" title="切換銅錢樣式（自動依時間選好，這裡可自行覆蓋）">
    <img id="coin-style-toggle-icon" src="assets/iching/coins/地錢-正面-八卦-圓形去背.png" alt="" class="coin-style-toggle-icon" />
    <span id="coin-style-toggle-label" class="coin-style-toggle-label">可切換至天錢</span>
  </button>

  <header class="site-header">
    <h1 class="site-title">金錢卦起卦</h1>
    <p class="site-subtitle">靜下心，擲銅錢、起卦</p>
  </header>

  <main class="table" id="iching-section">

    <div id="iching-form">
      <section class="iching-input">
        <h2 class="section-heading">在線起卦</h2>
        <p class="iching-hint">輸入問題，擲銅錢起卦</p>
        <textarea id="iching-question" class="iching-textarea" placeholder="想問的事情…" maxlength="80"></textarea>
        <button id="btn-iching-cast" class="tool-btn" type="button">開始起卦</button>
        <button id="btn-iching-quick-cast" class="tool-btn tool-btn-secondary" type="button">快速取卦（不用填問題）</button>
      </section>
    </div>

    <section id="manual-cast-section" class="iching-result manual-cast-section hidden"></section>

    <section id="iching-result" class="iching-result hidden"></section>

  </main>

  <script src="js/iching-data.js"></script>
  <script src="js/iching.js"></script>
</body>
</html>

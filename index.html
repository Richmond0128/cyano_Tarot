<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>塔羅占卜</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <a href="iching.html" class="page-switch page-switch-coin" title="金錢卦起卦" aria-label="切換到金錢卦起卦">
    <img src="assets/iching/coins/天錢-正面-八卦-icon.png" alt="" class="page-switch-icon" />
    <span class="page-switch-label">易經卜卦</span>
  </a>

  <header class="site-header">
    <h1 class="site-title">塔羅占卜</h1>
    <p class="site-subtitle">靜下心，洗牌、選牌</p>
  </header>

  <main class="table" id="tarot-section">

    <!-- ===================== 問題輸入（起手式，跟易經一致） ===================== -->
    <section id="tarot-question-section" class="iching-input">
      <h2 class="section-heading">在線占卜</h2>
      <p class="iching-hint">輸入想問的事情，或直接跳過開始抽牌</p>
      <textarea id="tarot-question" class="iching-textarea" placeholder="想問的事情…" maxlength="80"></textarea>
      <button id="btn-tarot-start" class="tool-btn" type="button">開始占卜</button>
      <button id="btn-tarot-skip" class="tool-btn tool-btn-secondary" type="button">跳過，直接抽牌</button>
    </section>

    <!-- ===================== 牌桌 ===================== -->
    <section id="tarot-table-section" class="hidden">

      <section class="toolbar">
        <button id="btn-shuffle" class="tool-btn tool-btn-icon" type="button" title="洗牌" aria-label="洗牌">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button id="btn-arrange" class="tool-btn tool-btn-icon" type="button" title="整牌" aria-label="整牌">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </button>
        <button id="btn-cut" class="tool-btn tool-btn-icon" type="button" title="切牌" aria-label="切牌">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
        </button>
        <button id="btn-fan" class="tool-btn tool-btn-icon" type="button" title="開扇" aria-label="開扇">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21 4 9a8 8 0 0 1 16 0Z"/><line x1="12" y1="21" x2="7.5" y2="8.3"/><line x1="12" y1="21" x2="12" y2="7"/><line x1="12" y1="21" x2="16.5" y2="8.3"/></svg>
        </button>
        <button id="btn-reset" class="tool-btn tool-btn-icon" type="button" title="重新開始" aria-label="重新開始">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <span class="draw-count">已抽 <span id="draw-count-num">0</span> 張</span>
      </section>

      <section class="quick-draw-row">
        <button id="btn-quick-draw-one" class="tool-btn tool-btn-secondary" type="button">快速抽一張</button>
      </section>

      <section class="drawn-area">
        <h2 class="drawn-title">已抽出的牌</h2>
        <div id="drawn-cards" class="drawn-cards"></div>
      </section>

      <section id="deck-area" class="deck-area">
        <div id="deck-stack" class="deck-stack"></div>
        <p id="deck-hint" class="deck-hint">請先洗牌，再點選「開扇」選牌</p>
      </section>

      <section id="cut-area" class="cut-area hidden"></section>

      <section id="fan-area" class="fan-area hidden"></section>

    </section>

  </main>

  <button id="btn-ai-interpret" class="ai-interpret-btn" type="button" title="AI 解牌">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-4 12.7V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3A7 7 0 0 0 12 2Z"/><line x1="10" y1="22" x2="14" y2="22"/></svg>
    <span>AI 解牌</span>
  </button>

  <script src="js/cards.js"></script>
  <script src="js/tarot-shared.js"></script>
  <script src="js/mode-full.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

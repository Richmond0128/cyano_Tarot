<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>塔羅占卜</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">塔羅占卜</h1>
    <p class="site-subtitle">靜下心，洗牌、選牌</p>
  </header>

  <nav class="mode-switch">
    <button id="mode-tarot" class="mode-btn active" type="button">塔羅占卜</button>
    <button id="mode-iching" class="mode-btn" type="button">金錢卦起卦</button>
  </nav>

  <main class="table" id="tarot-section">

    <section class="toolbar">
      <button id="btn-shuffle" class="tool-btn" type="button">洗牌</button>
      <button id="btn-spread" class="tool-btn" type="button">攤牌選牌</button>
      <button id="btn-reset" class="tool-btn" type="button">重新開始</button>
      <span class="draw-count">已抽 <span id="draw-count-num">0</span> 張</span>
    </section>

    <section id="deck-area" class="deck-area">
      <div id="deck-stack" class="deck-stack"></div>
      <p id="deck-hint" class="deck-hint">請先洗牌，再點選「攤牌選牌」</p>
    </section>

    <section id="fan-area" class="fan-area hidden">
    </section>

    <section id="drawn-area" class="drawn-area">
      <h2 class="drawn-title">已抽出的牌</h2>
      <div id="drawn-cards" class="drawn-cards"></div>
    </section>

  </main>

  <main class="table hidden" id="iching-section">

    <div id="iching-form">
      <section class="iching-input">
        <h2 class="section-heading">在線起卦</h2>
        <p class="iching-hint">輸入問題，擲銅錢起卦</p>
        <textarea id="iching-question" class="iching-textarea" placeholder="想問的事情…" maxlength="80"></textarea>
        <button id="btn-iching-cast" class="tool-btn" type="button">開始起卦</button>
      </section>
    </div>

    <section id="iching-result" class="iching-result hidden"></section>

  </main>

  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
  <script src="js/iching-data.js"></script>
  <script src="js/iching.js"></script>
  <script>
    (function () {
      const tarotSection = document.getElementById("tarot-section");
      const ichingSection = document.getElementById("iching-section");
      const btnTarot = document.getElementById("mode-tarot");
      const btnIching = document.getElementById("mode-iching");

      function showTarot() {
        tarotSection.classList.remove("hidden");
        ichingSection.classList.add("hidden");
        btnTarot.classList.add("active");
        btnIching.classList.remove("active");
      }

      function showIching() {
        ichingSection.classList.remove("hidden");
        tarotSection.classList.add("hidden");
        btnIching.classList.add("active");
        btnTarot.classList.remove("active");
      }

      btnTarot.addEventListener("click", showTarot);
      btnIching.addEventListener("click", showIching);
    })();
  </script>
</body>
</html>

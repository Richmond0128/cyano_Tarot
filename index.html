<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>塔羅占卜</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <a href="iching.html" class="page-switch page-switch-coin" title="金錢卦起卦" aria-label="切換到金錢卦起卦">
    <img src="assets/iching/coins/天錢-正面-八卦-icon.png" alt="" class="page-switch-icon" />
    <span class="page-switch-label">易經卜卦</span>
  </a>

  <header class="site-header">
    <h1 class="site-title">塔羅占卜</h1>
    <p class="site-subtitle">靜下心，洗牌、選牌</p>
  </header>

  <nav class="tarot-submode-switch">
    <button id="tarot-mode-full" class="submode-btn active" type="button">完整手洗體驗版</button>
    <button id="tarot-mode-quick" class="submode-btn" type="button">快速版</button>
  </nav>

  <!-- ===================== 完整手洗體驗版 ===================== -->
  <main class="table" id="tarot-full-section">

    <section class="toolbar">
      <button id="btn-full-shuffle" class="tool-btn tool-btn-icon" type="button" title="洗牌" aria-label="洗牌">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button id="btn-full-arrange" class="tool-btn tool-btn-icon" type="button" title="整牌" aria-label="整牌">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      </button>
      <button id="btn-full-cut" class="tool-btn tool-btn-icon" type="button" title="切牌" aria-label="切牌">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
      </button>
      <button id="btn-full-fan" class="tool-btn tool-btn-icon" type="button" title="開扇" aria-label="開扇">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21 4 9a8 8 0 0 1 16 0Z"/><line x1="12" y1="21" x2="7.5" y2="8.3"/><line x1="12" y1="21" x2="12" y2="7"/><line x1="12" y1="21" x2="16.5" y2="8.3"/></svg>
      </button>
      <button id="btn-full-reset" class="tool-btn tool-btn-icon" type="button" title="重新開始" aria-label="重新開始">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <span class="draw-count">已抽 <span id="full-draw-count-num">0</span> 張</span>
    </section>

    <section id="full-deck-area" class="deck-area">
      <div id="full-deck-stack" class="deck-stack"></div>
      <p id="full-deck-hint" class="deck-hint">請先洗牌，再點選「開扇」選牌</p>
    </section>

    <section id="full-cut-area" class="cut-area hidden"></section>

    <section id="full-fan-area" class="fan-area hidden"></section>

    <section class="drawn-area">
      <h2 class="drawn-title">已抽出的牌</h2>
      <div id="full-drawn-cards" class="drawn-cards"></div>
    </section>

  </main>

  <!-- ===================== 快速版 ===================== -->
  <main class="table hidden" id="tarot-quick-section">

    <section id="quick-setup" class="quick-setup">
      <p class="quick-setup-hint">這次想抽幾張牌？</p>
      <div class="quick-count-buttons">
        <button class="quick-count-btn" type="button" data-count="1">1 張</button>
        <button class="quick-count-btn active" type="button" data-count="3">3 張</button>
        <button class="quick-count-btn" type="button" data-count="5">5 張</button>
      </div>
      <div class="quick-count-custom">
        <label for="quick-count-input">或自訂張數</label>
        <input id="quick-count-input" type="number" min="1" max="78" value="3" />
        <button id="btn-quick-start" class="tool-btn" type="button">開始抽牌</button>
      </div>
    </section>

    <section id="quick-table" class="quick-table hidden">
      <p id="quick-progress-text" class="deck-hint"></p>
      <div id="quick-fan-area" class="fan-area"></div>
    </section>

    <section id="quick-drawn-area" class="drawn-area hidden">
      <h2 class="drawn-title">已抽出的牌</h2>
      <div id="quick-drawn-cards" class="drawn-cards"></div>

      <div id="quick-more-prompt" class="quick-more-prompt hidden">
        <p>要不要再多抽一張？</p>
        <button id="btn-quick-more" class="tool-btn" type="button">再抽一張</button>
        <button id="btn-quick-finish" class="tool-btn tool-btn-secondary" type="button">完成，不再抽了</button>
      </div>

      <button id="btn-quick-restart" class="tool-btn tool-btn-secondary quick-restart-btn" type="button">重新開始</button>
    </section>

  </main>

  <script src="js/cards.js"></script>
  <script src="js/tarot-shared.js"></script>
  <script src="js/mode-full.js"></script>
  <script src="js/mode-quick.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
